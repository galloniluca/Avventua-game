name = "avventua-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "avventua"
# Sostituire con l'ID reale dopo `wrangler d1 create avventua`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Provider AI attivo: "gemini" | "ollama" | "demo" | "mock"
AI_PROVIDER = "gemini"
GEMINI_MODEL = "gemini-2.0-flash"

# Modello locale via Ollama (usato solo con AI_PROVIDER = "ollama").
# num_ctx va tenuto alto: il prompt del DM supera facilmente i 2048 token di
# default di Ollama, e un contesto troppo corto fa dimenticare le istruzioni.
OLLAMA_URL = "http://127.0.0.1:11434"
OLLAMA_MODEL = "qwen2.5:7b"
OLLAMA_NUM_CTX = "8192"
# Sessioni accumulate prima di consolidare il riassunto di campagna.
CONSOLIDA_OGNI_N_SESSIONI = "5"
# Caratteri totali di delta oltre i quali si consolida comunque.
CONSOLIDA_SOGLIA_CARATTERI = "6000"
# Eventi recenti inclusi nel prompt del DM.
FINESTRA_EVENTI_RECENTI = "24"

# Segreti (NON metterli qui):
#   wrangler secret put GEMINI_API_KEY
# In locale: file backend/.dev.vars con GEMINI_API_KEY="..."
